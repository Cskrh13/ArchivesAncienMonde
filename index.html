<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Archives du Courant</title>


    <!-- =========================================================
         POLICES
         ========================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Vollkorn:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================================
           PALETTE
           ========================================================= */

        :root {

            --fond: #15191a;

            --bleu-noir: #1b2325;

            --bleu-ardoise: #2d393d;

            --bleu-gris: #435156;

            --parchemin: #c8bd9d;

            --parchemin-clair: #ded4b7;

            --parchemin-fonce: #a89d7e;

            --encre: #252a29;

            --encre-claire: #4b514f;

            --texte-clair: #d8d1b8;

            --argent: #91a6aa;

            --ligne: rgba(125, 139, 140, 0.50);

            --ombre: rgba(0, 0, 0, 0.45);

        }


        /* =========================================================
           BASE
           ========================================================= */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            color: var(--encre);

            font-family:
                "Vollkorn",
                Georgia,
                serif;

            line-height: 1.65;

            background-color: var(--parchemin);

            background-image:

                linear-gradient(
                    rgba(170, 145, 105, 0.72),
                    rgba(170, 145, 105, 0.72)
                ),

                url("images/fond-carte.jpg");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

        }


        /* =========================================================
           VIGNETTE DE PARCHEMIN
           ========================================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: -1;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 35%,
                    rgba(55, 38, 19, 0.20) 100%
                );

        }


        /* =========================================================
           CADRE PRINCIPAL
           ========================================================= */

        .page {

            width: calc(100% - 40px);

            max-width: 1250px;

            margin: 30px auto;

        }


        /* =========================================================
           EN-TÊTE
           ========================================================= */

        header {

            position: relative;

            text-align: center;

            padding: 55px 30px 45px;

            background:

                linear-gradient(
                    rgba(25, 32, 34, 0.88),
                    rgba(30, 38, 40, 0.88)
                ),

                url("images/fond-carte.jpg");

            background-size: cover;

            background-position: center;

            border: 1px solid var(--ligne);

            box-shadow:
                0 8px 25px var(--ombre);

        }


        header::before {

            content: "";

            position: absolute;

            inset: 12px;

            border:
                1px solid rgba(210, 195, 160, 0.25);

            pointer-events: none;

        }


        header h1 {

            position: relative;

            margin: 0;

            color: #d8d1b8;

            font-family:
                "IM FELL English SC",
                Georgia,
                serif;

            font-size:
                clamp(38px, 6vw, 72px);

            font-weight: normal;

            letter-spacing: 7px;

            text-transform: uppercase;

            text-shadow:
                1px 1px 0 rgba(255,255,255,0.25);

        }


        header .subtitle {

            position: relative;

            margin: 15px 0 0;

            color: #aaa89b;

            font-size: 14px;

            letter-spacing: 4px;

            text-transform: uppercase;

        }


        header .ornament {

            position: relative;

            margin: 22px auto 0;

            width: 220px;

            height: 1px;

            background: var(--ligne);

        }


        header .ornament::before,
        header .ornament::after {

            content: "◆";

            position: absolute;

            top: -9px;

            color: var(--encre-claire);

            font-size: 12px;

        }


        header .ornament::before {
            left: -6px;
        }


        header .ornament::after {
            right: -6px;
        }


        /* =========================================================
           NAVIGATION PRINCIPALE
           ========================================================= */

        nav {

            position: relative;

            z-index: 1000;

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 4px;

            margin-top: 12px;

            padding: 8px;

            background:
                rgba(27, 35, 37, 0.97);

            border:
                1px solid rgba(120, 137, 139, 0.55);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.45);

        }


        nav > a,
        .nav-dropdown > .drop-title {

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 48px;

            padding:
                8px 20px;

            color: #c4c7bc;

            text-decoration: none;

            font-family:
                "IM FELL English SC",
                Georgia,
                serif;

            font-size: 15px;

            letter-spacing: 1.5px;

            border:
                1px solid transparent;

            transition:
                background 0.25s ease,
                color 0.25s ease;

        }


        nav > a:hover,
        .nav-dropdown:hover > .drop-title {

            color: #eee5cf;

            background:
                rgba(145, 166, 170, 0.15);

            border-color:
                rgba(145, 166, 170, 0.35);

        }


        /* =========================================================
           SOUS-MENUS
           ========================================================= */

        .nav-dropdown {

            position: relative;

        }


        .drop-title span {

            margin-left: 8px;

            font-size: 11px;

            opacity: 0.7;

            transition:
                transform 0.25s ease;

        }


        .nav-dropdown:hover
        .drop-title span {

            transform:
                rotate(180deg);

        }


        .dropdown-content {

            position: absolute;

            top: calc(100% + 5px);

            left: 50%;

            min-width: 270px;

            padding: 8px;

            background:
                #252c2d;

            border:
                1px solid #9c8d69;

            box-shadow:
                0 12px 30px rgba(0,0,0,0.55);

            opacity: 0;

            visibility: hidden;

            transform:
                translate(-50%, -8px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease,
                visibility 0.2s ease;

        }


        .nav-dropdown:hover
        .dropdown-content {

            opacity: 1;

            visibility: visible;

            transform:
                translate(-50%, 0);

        }


        .dropdown-content a {

            display: block;

            padding:
                12px 17px;

            color: #d8d1b8;

            text-decoration: none;

            font-family:
                "Vollkorn",
                Georgia,
                serif;

            font-size: 16px;

            border-bottom:
                1px solid rgba(190,170,125,0.15);

            transition:
                background 0.2s ease,
                padding-left 0.2s ease;

        }


        .dropdown-content a:last-child {
            border-bottom: none;
        }


        .dropdown-content a:hover {

            background:
                rgba(190,170,125,0.12);

            padding-left: 24px;

        }


        /* =========================================================
           CONTENU
           ========================================================= */

        main {
            margin-top: 25px;
        }


        /* =========================================================
           GRANDE IMAGE / ACTUALITÉ
           ========================================================= */

        .hero {

            position: relative;

            min-height: 600px;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            align-items: center;

            text-align: center;

            padding:
                70px 40px;

            overflow: hidden;

            border:
                1px solid var(--ligne);

            box-shadow:
                0 8px 25px var(--ombre);

            background:

                linear-gradient(
                    to bottom,
                    rgba(20, 25, 25, 0.05) 20%,
                    rgba(20, 25, 25, 0.88) 100%
                ),

                url("d9354623-1af7-4db7-97ab-e61d15d373db.png");

            background-size: cover;

            background-position: center;

        }


        .hero::before {

            content: "";

            position: absolute;

            inset: 15px;

            border:
                1px solid rgba(224, 201, 157, 0.65);

            pointer-events: none;

        }


        .hero-content {

            position: relative;

            z-index: 2;

            max-width: 800px;

            color: #ead8b0;

        }


        .hero h2 {

            margin: 0;

            font-family:
                "IM FELL English SC",
                Georgia,
                serif;

            font-size:
                clamp(34px, 5vw, 58px);

            font-weight: normal;

            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow:
                2px 2px 4px rgba(0,0,0,0.75);

        }


        .hero .separator {

            width: 180px;

            height: 1px;

            margin:
                18px auto;

            background:
                #d7bd89;

        }


        .hero p {

            margin:
                0 auto;

            max-width: 720px;

            font-size: 18px;

            color: #e1d1ad;

            text-shadow:
                1px 1px 3px #000;

        }


        /* =========================================================
           BOUTONS
           ========================================================= */

        .button {

            display: block;

            width: fit-content;

            margin:
                25px auto 0;

            padding:
                12px 28px;

            color: #202728;

            background:
                #b7b39d;

            border:
                1px solid #4f5b5d;

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.40);

            text-decoration: none;

            font-family:
                "IM FELL English SC",
                Georgia,
                serif;

            font-size: 14px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            text-align: center;

            transition:
                0.2s;

        }


        .button:hover {

            background:
                #d5d0b6;

            color:
                #172022;

            transform:
                translateY(-1px);

        }


        /* =========================================================
           TITRES DE SECTIONS
           ========================================================= */

        .section-title {

            position: relative;

            margin:
                75px 0 30px;

            text-align: center;

            font-family:
                "IM FELL English SC",
                Georgia,
                serif;

            font-size: 30px;

            font-weight: normal;

            letter-spacing: 4px;

            text-transform: uppercase;

            color:
                #d0c8aa;

        }


        .section-title::before,
        .section-title::after {

            content: "";

            display: inline-block;

            width: 100px;

            height: 1px;

            margin:
                0 18px 9px;

            background:
                rgba(130, 145, 145, 0.65);

        }


        /* =========================================================
           BANDE HORIZONTALE DES SUPPLÉMENTS
        ========================================================= */

        .supplement-strip {

            position: relative;

            display: flex;

            align-items: stretch;

            gap: 12px;

            padding:
                12px 45px;

            margin-bottom: 25px;

            background:
                rgba(27, 35, 37, 0.93);

            border:
                1px solid var(--ligne);

            box-shadow:
                0 5px 15px rgba(0,0,0,0.35);

            overflow-x: auto;

            scrollbar-width: thin;

        }


        .strip-item {

            flex:
                0 0 130px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            padding:
                8px;

            color:
                #d8d1b8;

            text-decoration: none;

            border:
                1px solid transparent;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                transform 0.25s ease;

        }


        .strip-item:hover {

            background:
                rgba(190,170,125,0.10);

            border-color:
                rgba(190,170,125,0.40);

            transform:
                translateY(-2px);

        }


        .strip-item img {

            display: block;

            width: 90px;

            height: 125px;

            object-fit: contain;

            background:
                #161a1b;

            border:
                1px solid rgba(200,190,160,0.45);

        }


        .strip-item span {

            margin-top: 8px;

            font-family:
                "IM FELL English SC",
                Georgia,
                serif;

            font-size: 13px;

            text-align: center;

            line-height: 1.25;

        }


        /* =========================================================
           GRILLE DES CARTES
           ========================================================= */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 22px;

            align-items: stretch;

        }


        /* =========================================================
           CARTE DE SUPPLÉMENT
           ========================================================= */

        .card {

            position: relative;

            display: flex;

            flex-direction: column;

            overflow: hidden;

            min-width: 0;

            padding:
                0 32px 32px;

            background:

                linear-gradient(
                    rgba(205, 197, 169, 0.96),
                    rgba(178, 173, 150, 0.96)
                );

            border:
                1px solid rgba(63, 73, 73, 0.75);

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.40);

        }


        /* Cadre intérieur */

        .card::before {

            content: "";

            position: absolute;

            inset: 9px;

            border:
                1px solid rgba(75, 55, 31, 0.25);

            pointer-events: none;

            z-index: 3;

        }


        /* =========================================================
           IMAGE DE COUVERTURE
           ========================================================= */

        .card-image {

            display: block;

            width: 100%;

            height: 420px;

            object-fit: contain;

            object-position: center;

            margin:
                0 0 25px;

            padding: 10px;

            background:
                #222827;

            border-bottom:
                1px solid rgba(63, 73, 73, 0.75);

        }


        /* =========================================================
           CONTENU DES CARTES
           ========================================================= */

        .card h3 {

            position: relative;

            margin:
                0 0 20px;

            color:
                var(--encre);

            font-family:
                "IM FELL English SC",
                Georgia,
                serif;

            font-size: 25px;

            font-weight: normal;

            letter-spacing: 1px;

            overflow-wrap: anywhere;

        }


        .card p {

            position: relative;

            margin:
                0;

            color:
                #51402b;

            font-family:
                "Vollkorn",
                Georgia,
                serif;

            font-size: 16px;

        }


        /* Le bouton reste en bas */

        .card .button {

            position: relative;

            margin-top: auto;

        }


        /* =========================================================
           CARTES
           ========================================================= */

        .map-card {

            min-height: 320px;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            align-items: center;

            padding: 40px;

            text-align: center;

            color: #e4d2a9;

            background:

                linear-gradient(
                    rgba(45, 30, 15, 0.15),
                    rgba(45, 30, 15, 0.82)
                ),

                url("images/fond-carte.jpg");

            background-size: cover;

            background-position: center;

            border:
                1px solid var(--ligne);

        }


        .map-card h3 {

            color:
                #ead9b4;

            font-family:
                "IM FELL English SC",
                Georgia,
                serif;

            font-size: 27px;

            text-shadow:
                1px 1px 4px #000;

        }


        .map-card p {

            max-width: 700px;

            color:
                #dbc9a5;

            text-shadow:
                1px 1px 3px #000;

        }


        /* =========================================================
           FIGURINES
           ========================================================= */

        .figure-card {

            position: relative;

            display: flex;

            flex-direction: column;

            overflow: hidden;

            min-width: 0;

            background:

                linear-gradient(
                    rgba(205, 197, 169, 0.96),
                    rgba(178, 173, 150, 0.96)
                );

            border:
                1px solid rgba(63, 73, 73, 0.75);

            box-shadow:
                0 6px 18px rgba(0,0,0,0.40);

        }


        .figure-card img {

            display: block;

            width: 100%;

            height: 300px;

            object-fit: contain;

            padding: 15px;

            background:
                #222827;

        }


        .figure-content {

            display: flex;

            flex-direction: column;

            flex: 1;

            padding: 28px;

        }


        .figure-content h3 {

            margin-top: 0;

            font-family:
                "IM FELL English SC",
                Georgia,
                serif;

            font-size: 24px;

            font-weight: normal;

        }


        .figure-content .button {

            margin-top: auto;

        }


        /* =========================================================
           INSTAGRAM
           ========================================================= */

        .instagram-section {

            margin-top: 80px;

            text-align: center;

        }


        .instagram-frame {

            padding:
                15px;

            background:
                rgba(30, 36, 36, 0.80);

            border:
                1px solid var(--ligne);

            box-shadow:
                0 6px 18px rgba(0,0,0,0.35);

        }


        .instagram-link {

            display: inline-block;

            margin-top: 20px;

            color:
                #40382d;

            font-family:
                "IM FELL English SC",
                Georgia,
                serif;

            text-decoration: none;

            letter-spacing: 1px;

        }


        .instagram-link:hover {

            text-decoration: underline;

        }


        /* =========================================================
           PIED DE PAGE
           ========================================================= */

        footer {

            margin-top: 80px;

            padding:
                40px 20px;

            text-align: center;

            color:
                #56442d;

            border-top:
                1px solid var(--ligne);

            font-size: 13px;

            letter-spacing: 1px;

        }


        .footer-title {

            font-family:
                "IM FELL English SC",
                Georgia,
                serif;

            font-size: 22px;

        }

/* =========================================================
   ADAPTATION PROPORTIONNELLE
   Le même design sur ordinateur, tablette et téléphone
   ========================================================= */


/* ---------------------------------------------------------
   PAGE
   --------------------------------------------------------- */

.page {

    width: calc(100% - clamp(20px, 5vw, 40px));

    max-width: 1250px;

    margin:
        clamp(10px, 2.4vw, 30px) auto;

}


/* ---------------------------------------------------------
   EN-TÊTE
   --------------------------------------------------------- */

header {

    padding:
        clamp(30px, 4.5vw, 55px)
        clamp(15px, 2.5vw, 30px)
        clamp(25px, 3.5vw, 45px);

}


header h1 {

    font-size:
        clamp(28px, 6vw, 72px);

    letter-spacing:
        clamp(2px, 0.6vw, 7px);

}


header .subtitle {

    font-size:
        clamp(9px, 1.15vw, 14px);

    letter-spacing:
        clamp(1px, 0.3vw, 4px);

    line-height: 1.5;

}


header .ornament {

    width:
        clamp(100px, 18vw, 220px);

}


/* ---------------------------------------------------------
   NAVIGATION
   --------------------------------------------------------- */

nav {

    gap:
        clamp(2px, 0.35vw, 4px);

    padding:
        clamp(5px, 0.7vw, 8px);

}


nav > a,
.nav-dropdown > .drop-title {

    min-height:
        clamp(38px, 4vw, 48px);

    padding:
        clamp(6px, 0.7vw, 8px)
        clamp(8px, 1.6vw, 20px);

    font-size:
        clamp(10px, 1.15vw, 15px);

    letter-spacing:
        clamp(0.5px, 0.12vw, 1.5px);

}


.dropdown-content {

    min-width:
        clamp(210px, 22vw, 270px);

}


.dropdown-content a {

    padding:
        clamp(9px, 1vw, 12px)
        clamp(12px, 1.4vw, 17px);

    font-size:
        clamp(13px, 1.3vw, 16px);

}


/* ---------------------------------------------------------
   CONTENU
   --------------------------------------------------------- */

main {

    margin-top:
        clamp(15px, 2vw, 25px);

}


/* ---------------------------------------------------------
   HERO / ACTUALITÉ
   --------------------------------------------------------- */

.hero {

    min-height:
        clamp(400px, 48vw, 600px);

    padding:
        clamp(35px, 5vw, 70px)
        clamp(18px, 3.2vw, 40px);

}


.hero::before {

    inset:
        clamp(8px, 1.2vw, 15px);

}


.hero-content {

    width: 100%;

    max-width:
        clamp(500px, 65vw, 800px);

}


.hero h2 {

    font-size:
        clamp(27px, 5vw, 58px);

    letter-spacing:
        clamp(1.5px, 0.35vw, 4px);

}


.hero .separator {

    width:
        clamp(90px, 15vw, 180px);

    margin:
        clamp(12px, 1.5vw, 18px) auto;

}


.hero p {

    max-width:
        clamp(300px, 58vw, 720px);

    font-size:
        clamp(14px, 1.5vw, 18px);

    line-height:
        clamp(1.5, 1.65vw, 1.65);

}


/* ---------------------------------------------------------
   BOUTONS
   --------------------------------------------------------- */

.button {

    max-width: 100%;

    margin-top:
        clamp(15px, 2vw, 25px);

    padding:
        clamp(9px, 1vw, 12px)
        clamp(14px, 2.2vw, 28px);

    font-size:
        clamp(10px, 1.15vw, 14px);

    letter-spacing:
        clamp(0.7px, 0.15vw, 1.5px);

}


/* ---------------------------------------------------------
   TITRES DE SECTIONS
   --------------------------------------------------------- */

.section-title {

    margin:
        clamp(45px, 6vw, 75px)
        0
        clamp(20px, 2.5vw, 30px);

    font-size:
        clamp(21px, 2.5vw, 30px);

    letter-spacing:
        clamp(1.5px, 0.35vw, 4px);

}


.section-title::before,
.section-title::after {

    width:
        clamp(25px, 8vw, 100px);

    margin:
        0
        clamp(5px, 1.4vw, 18px)
        7px;

}


/* ---------------------------------------------------------
   BANDE DES SUPPLÉMENTS
   --------------------------------------------------------- */

.supplement-strip {

    gap:
        clamp(6px, 1vw, 12px);

    padding:
        clamp(8px, 1vw, 12px)
        clamp(12px, 3.5vw, 45px);

}


.strip-item {

    flex-basis:
        clamp(90px, 10vw, 130px);

    padding:
        clamp(5px, 0.65vw, 8px);

}


.strip-item img {

    width:
        clamp(65px, 7vw, 90px);

    height:
        clamp(90px, 10vw, 125px);

}


.strip-item span {

    margin-top:
        clamp(5px, 0.65vw, 8px);

    font-size:
        clamp(10px, 1vw, 13px);

}


/* ---------------------------------------------------------
   GRILLE
   --------------------------------------------------------- */

.grid {

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                clamp(240px, 25vw, 280px),
                1fr
            )
        );

    gap:
        clamp(12px, 1.8vw, 22px);

}


/* ---------------------------------------------------------
   CARTES DES SUPPLÉMENTS
   --------------------------------------------------------- */

.card {

    padding:
        0
        clamp(16px, 2.5vw, 32px)
        clamp(20px, 2.5vw, 32px);

}


.card::before {

    inset:
        clamp(6px, 0.75vw, 9px);

}


.card-image {

    height:
        clamp(260px, 34vw, 420px);

    margin-bottom:
        clamp(15px, 2vw, 25px);

    padding:
        clamp(6px, 0.8vw, 10px);

}


.card h3 {

    margin-bottom:
        clamp(12px, 1.6vw, 20px);

    font-size:
        clamp(18px, 2vw, 25px);

    line-height: 1.25;

}


.card p {

    font-size:
        clamp(13px, 1.3vw, 16px);

    line-height:
        clamp(1.5, 1.65vw, 1.65);

}


/* ---------------------------------------------------------
   CARTES
   --------------------------------------------------------- */

.map-card {

    min-height:
        clamp(240px, 26vw, 320px);

    padding:
        clamp(25px, 3.2vw, 40px);

}


.map-card h3 {

    font-size:
        clamp(20px, 2.2vw, 27px);

    line-height: 1.25;

}


.map-card p {

    max-width:
        clamp(280px, 58vw, 700px);

    font-size:
        clamp(13px, 1.4vw, 16px);

}


/* ---------------------------------------------------------
   FIGURINES
   --------------------------------------------------------- */

.figure-card img {

    height:
        clamp(220px, 24vw, 300px);

    padding:
        clamp(8px, 1.2vw, 15px);

}


.figure-content {

    padding:
        clamp(18px, 2.2vw, 28px);

}


.figure-content h3 {

    font-size:
        clamp(19px, 2vw, 24px);

}


.figure-content p {

    font-size:
        clamp(13px, 1.3vw, 16px);

}


/* ---------------------------------------------------------
   INSTAGRAM
   --------------------------------------------------------- */

.instagram-section {

    margin-top:
        clamp(45px, 6vw, 80px);

}


.instagram-frame {

    padding:
        clamp(8px, 1.2vw, 15px);

}


/* ---------------------------------------------------------
   PIED DE PAGE
   --------------------------------------------------------- */

footer {

    margin-top:
        clamp(45px, 6vw, 80px);

    padding:
        clamp(25px, 3.2vw, 40px)
        clamp(12px, 2vw, 20px);

    font-size:
        clamp(10px, 1.1vw, 13px);

}


.footer-title {

    font-size:
        clamp(17px, 1.8vw, 22px);

}


/* ---------------------------------------------------------
   SÉCURITÉ : RIEN NE DOIT DÉBORDER
   --------------------------------------------------------- */

img {

    max-width: 100%;

}


h1,
h2,
h3,
p,
a {

    overflow-wrap: break-word;

}


/* ---------------------------------------------------------
   PETITE CORRECTION POUR LES TRÈS PETITS ÉCRANS
   On ne change PAS le design : on empêche simplement
   certains éléments de devenir trop larges.
   --------------------------------------------------------- */

@media (max-width: 500px) {

    .page {

        width:
            calc(100% - 12px);

        margin:
            6px auto;

    }


    nav {

        overflow-x: auto;

        justify-content: flex-start;

        flex-wrap: nowrap;

    }


    nav > a,
    .nav-dropdown > .drop-title {

        flex-shrink: 0;

    }


    .hero {

        min-height:
            clamp(380px, 120vw, 500px);

    }


    .hero-content {

        max-width: 100%;

    }


    .grid {

        grid-template-columns: 1fr;

    }

}


</body>

</html>
