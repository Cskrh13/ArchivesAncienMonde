<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créateur de listes — Archives du Courant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Vollkorn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#15191a;--bleu:#1b2325;--bleu2:#2d393d;--parch:#c8bd9d;--parch2:#ded4b7;
  --encre:#252a29;--clair:#e4dcc5;--ligne:rgba(125,139,140,.5);
  --vert:#9caf92;--rouge:#c28e82;--or:#c9ae78;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
linear-gradient(rgba(170,145,105,.72),rgba(170,145,105,.72)),
url("images/fond-carte.jpg");background-size:cover;background-position:center;background-attachment:fixed;
color:var(--encre);font-family:"Vollkorn",Georgia,serif;line-height:1.55}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(55,38,19,.2));z-index:-1}
.page{width:min(1500px,calc(100% - 30px));margin:20px auto 50px}
header{background:linear-gradient(rgba(25,32,34,.94),rgba(30,38,40,.94)),url("images/fond-carte.jpg");background-size:cover;border:1px solid var(--ligne);box-shadow:0 8px 25px rgba(0,0,0,.45);padding:34px 25px;text-align:center}
header h1{margin:0;color:#d8d1b8;font:normal clamp(32px,5vw,58px)/1.1 "IM Fell English SC",Georgia,serif;letter-spacing:5px;text-transform:uppercase}
header p{margin:10px 0 0;color:#aaa89b;letter-spacing:2px;text-transform:uppercase;font-size:12px}
.controls{margin-top:14px;background:rgba(27,35,37,.97);border:1px solid var(--ligne);padding:16px;display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:12px;align-items:end;box-shadow:0 5px 15px rgba(0,0,0,.35)}
.field label{display:block;color:#c8c1aa;font:13px "IM Fell English SC",Georgia,serif;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
select,input{width:100%;min-height:42px;border:1px solid #687477;background:#202829;color:#ddd5bc;padding:8px 11px;font:15px "Vollkorn",Georgia,serif}
button,.button{border:1px solid #657275;background:#b7b39d;color:#202728;padding:10px 15px;cursor:pointer;font:14px "IM Fell English SC",Georgia,serif;letter-spacing:1px;text-transform:uppercase}
button:hover,.button:hover{background:#d5d0b6}
.status{margin-top:12px;padding:10px 14px;background:rgba(27,35,37,.92);color:#d8d1b8;border:1px solid var(--ligne);font-size:14px}
.status.error{color:#f0c4bc;border-color:rgba(194,142,130,.6)}
.status.ok{color:#cbd9c4;border-color:rgba(156,175,146,.5)}
.workspace{margin-top:18px;display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(360px,1.6fr) minmax(240px,.8fr);gap:16px;align-items:start}
.panel{background:linear-gradient(rgba(205,197,169,.97),rgba(178,173,150,.97));border:1px solid rgba(63,73,73,.75);box-shadow:0 6px 18px rgba(0,0,0,.4);padding:18px}
.panel.dark{background:rgba(27,35,37,.96);color:#ddd5bc;border-color:var(--ligne)}
.panel h2{margin:0 0 14px;font:normal 24px "IM Fell English SC",Georgia,serif;letter-spacing:1px}
.panel h3{margin:20px 0 8px;font:normal 19px "IM Fell English SC",Georgia,serif;border-bottom:1px solid rgba(70,60,40,.25);padding-bottom:5px}
.unit-card{border:1px solid rgba(63,73,73,.45);background:rgba(222,212,183,.45);margin:8px 0;padding:10px 11px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.unit-name{font-weight:700}
.unit-meta{font-size:13px;color:#5b503b}
.unit-rules{font-size:12px;color:#655941;margin-top:3px}
.add-btn{padding:7px 10px;font-size:12px}
.category-title{display:flex;justify-content:space-between;align-items:center;color:#51402b}
.badge{font-size:11px;padding:2px 7px;border:1px solid rgba(63,73,73,.35);background:rgba(0,0,0,.05)}
.army-unit{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(190,170,125,.2)}
.qty-controls{display:flex;align-items:center;gap:5px}
.qty-controls button{padding:4px 8px;min-width:30px}
.qty{min-width:22px;text-align:center;font-weight:700}
.remove{background:#66504b;color:#eee0d6;border-color:#80655e}
.remove:hover{background:#7c5d56}
.empty{padding:20px;text-align:center;color:#6b604b;font-style:italic}
.summary-total{font:normal 30px "IM Fell English SC",Georgia,serif;color:#ead8b0}
.dark .summary-total{color:#ead8b0}
.summary-line{display:flex;justify-content:space-between;border-bottom:1px solid rgba(190,170,125,.18);padding:7px 0}
.valid{color:var(--vert)}.invalid{color:var(--rouge)}
.rule-list{margin:8px 0 0;padding-left:18px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.small{font-size:12px;color:#77705f}
.dark .small{color:#aaa89b}
.notice{padding:9px 10px;margin:8px 0;background:rgba(194,142,130,.12);border-left:3px solid var(--rouge);font-size:13px}
@media(max-width:1050px){.workspace{grid-template-columns:1fr 1fr}.summary-panel{grid-column:1/-1}.controls{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.page{width:calc(100% - 14px);margin:7px auto 30px}.controls{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.summary-panel{grid-column:auto}.army-unit{grid-template-columns:1fr auto}.army-unit .remove{grid-column:2}.panel{padding:14px}header h1{letter-spacing:2px}}
</style>
</head>
<body>
<div class="page">
<header>
  <h1>Créateur de Listes</h1>
  <p>Archives du Courant · listes d'armée pour les suppléments fan-made</p>
</header>

<section class="controls">
  <div class="field">
    <label for="supplementSelect">Supplément</label>
    <select id="supplementSelect"><option>Chargement…</option></select>
  </div>
  <div class="field" id="armyField" style="display:none">
    <label for="armySelect">Armée de référence</label>
    <select id="armySelect"></select>
  </div>
  <div class="field">
    <label for="pointsInput">Format</label>
    <input id="pointsInput" type="number" min="1" step="50" value="2000">
  </div>
  <div class="field">
    <label for="nameInput">Nom de la liste</label>
    <input id="nameInput" type="text" placeholder="Ma liste">
  </div>
  <button id="newListBtn" type="button">Nouvelle liste</button>
</section>
<div id="status" class="status">Chargement des données…</div>

<main class="workspace">
  <section class="panel">
    <h2>Unités disponibles</h2>
    <div id="availableUnits"></div>
  </section>

  <section class="panel">
    <h2>Ma liste</h2>
    <div id="armyList"></div>
    <div id="listEmpty" class="empty">Ajoutez des unités depuis le panneau de gauche.</div>
  </section>

  <aside class="panel dark summary-panel">
    <h2>État de la liste</h2>
    <div class="summary-total"><span id="totalPoints">0</span> pts</div>
    <div class="summary-line"><span>Format</span><strong id="formatPoints">2000</strong></div>
    <div class="summary-line"><span>Restant</span><strong id="remainingPoints">2000</strong></div>
    <div class="summary-line"><span>Unités</span><strong id="unitCount">0</strong></div>
    <h3>Validation</h3>
    <div id="validation"></div>
    <h3>Contraintes</h3>
    <div id="constraints"></div>
    <div class="actions">
      <button id="printBtn" type="button">Imprimer</button>
      <button id="saveBtn" type="button">Sauvegarder</button>
      <button id="loadBtn" type="button">Charger</button>
      <button id="clearBtn" type="button">Vider</button>
    </div>
  </aside>
</main>
</div>
<script src="js/generator.js"></script>
</body>
</html>
